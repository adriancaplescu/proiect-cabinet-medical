{% extends 'cabinet/base.html' %}
{% block titlu %}Autentificare{% endblock %}
{% block continut %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Autentificare</h4>
        {% if form.errors %}
          <div class="alert alert-danger">Utilizator sau parolă greșită.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Utilizator</label>
            <input class="form-control" type="text" name="username" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Parolă</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">Intră</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
